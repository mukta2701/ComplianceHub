name: Deploy Azure staging

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to Azure after publishing the image
        required: true
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "infra/azure/**"
      - "Dockerfile"
      - ".dockerignore"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-azure-staging.yml"

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: compliancehub-azure-staging
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mukta2701/compliancehub
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  AZURE_CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP }}
  AZURE_CONTAINER_ENVIRONMENT: ${{ vars.AZURE_CONTAINER_ENVIRONMENT }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: azure-staging
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify application
        run: npm run verify
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish immutable image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log in to Azure with OIDC
        if: github.event_name == 'push' || inputs.deploy
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy immutable image and configuration
        if: github.event_name == 'push' || inputs.deploy
        env:
          IMAGE_REFERENCE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_ENCRYPTION_KEY: ${{ secrets.APP_ENCRYPTION_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          parameters_file="$(mktemp "$RUNNER_TEMP/compliancehub-parameters.XXXXXX.json")"
          trap 'rm -f "$parameters_file"' EXIT
          chmod 600 "$parameters_file"
          jq --null-input \
            --arg managedEnvironmentName "$AZURE_CONTAINER_ENVIRONMENT" \
            --arg containerAppName "$AZURE_CONTAINER_APP" \
            --arg imageReference "$IMAGE_REFERENCE" \
            --arg revisionSuffix "run-${GITHUB_RUN_ID}" \
            --arg nextPublicSupabaseUrl "${{ vars.NEXT_PUBLIC_SUPABASE_URL }}" \
            --arg nextPublicSupabaseAnonKey "${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            --arg nextPublicSupabasePublishableKey "${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}" \
            --arg nextPublicSiteUrl "${{ vars.NEXT_PUBLIC_SITE_URL }}" \
            --arg mcpResourceUrl "${{ vars.MCP_RESOURCE_URL }}" \
            --arg supabaseOauthIssuer "${{ vars.SUPABASE_OAUTH_ISSUER }}" \
            --arg supabaseOauthJwksUrl "${{ vars.SUPABASE_OAUTH_JWKS_URL }}" \
            --arg mcpJwtAlgorithms "${{ vars.MCP_JWT_ALGORITHMS }}" \
            '{
              "$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#",
              contentVersion: "1.0.0.0",
              parameters: {
                managedEnvironmentName: { value: $managedEnvironmentName },
                containerAppName: { value: $containerAppName },
                imageReference: { value: $imageReference },
                revisionSuffix: { value: $revisionSuffix },
                nextPublicSupabaseUrl: { value: $nextPublicSupabaseUrl },
                nextPublicSupabaseAnonKey: { value: $nextPublicSupabaseAnonKey },
                nextPublicSupabasePublishableKey: { value: $nextPublicSupabasePublishableKey },
                nextPublicSiteUrl: { value: $nextPublicSiteUrl },
                mcpResourceUrl: { value: $mcpResourceUrl },
                supabaseOauthIssuer: { value: $supabaseOauthIssuer },
                supabaseOauthJwksUrl: { value: $supabaseOauthJwksUrl },
                mcpJwtAlgorithms: { value: $mcpJwtAlgorithms },
                supabaseServiceRoleKey: { value: env.SUPABASE_SERVICE_ROLE_KEY },
                appEncryptionKey: { value: env.APP_ENCRYPTION_KEY },
                cronSecret: { value: env.CRON_SECRET }
              }
            }' > "$parameters_file"
          az deployment group create \
            --name "compliancehub-${GITHUB_RUN_ID}" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/azure/application.bicep \
            --parameters "@$parameters_file" \
            --only-show-errors \
            --output none

      - name: Verify deployed liveness and readiness
        if: github.event_name == 'push' || inputs.deploy
        run: |
          fqdn="$(az containerapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_CONTAINER_APP" --query properties.configuration.ingress.fqdn --output tsv)"
          curl --fail-with-body --retry 5 --retry-all-errors --retry-delay 5 --max-time 120 "https://${fqdn}/api/health/live"
          curl --fail-with-body --retry 5 --retry-all-errors --retry-delay 5 --max-time 120 "https://${fqdn}/api/health"
