name: Deploy Azure staging

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to Azure after publishing the image
        required: true
        type: boolean
        default: true
      rollout_phase:
        description: Staged Slack destination rollout phase
        required: true
        type: choice
        options:
          - bridge
          - final
        default: final
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: compliancehub-azure-staging
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mukta2701/compliancehub
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  AZURE_CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP }}
  AZURE_CONTAINER_ENVIRONMENT: ${{ vars.AZURE_CONTAINER_ENVIRONMENT }}
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  ROLLOUT_PHASE: ${{ github.event_name == 'workflow_dispatch' && inputs.rollout_phase || 'final' }}

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify application
        run: npm run verify
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and publish immutable image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEPLOY_SHA }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    if: github.event_name == 'workflow_run' || inputs.deploy
    runs-on: ubuntu-latest
    environment: azure-staging
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Log in to Azure with OIDC
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Capture rollback revision and select inactive secret slot
        id: rollout
        run: |
          set -euo pipefail
          case "$ROLLOUT_PHASE" in
            bridge)
              runtime_reservation_mode="bridge"
              expected_migration_version="20260825040825"
              rollback_capability_required="false"
              ;;
            final)
              runtime_reservation_mode="strict"
              expected_migration_version="20260825053718"
              rollback_capability_required="true"
              ;;
            *) exit 1 ;;
          esac
          previous_revision="$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_APP" \
            --query properties.latestReadyRevisionName \
            --output tsv)"
          test -n "$previous_revision"
          current_environment="$(az containerapp revision show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_APP" \
            --revision "$previous_revision" \
            --query 'properties.template.containers[0].env' \
            --output json)"
          previous_image="$(az containerapp revision show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_APP" \
            --revision "$previous_revision" \
            --query 'properties.template.containers[0].image' \
            --output tsv)"
          test -n "$previous_image"
          previous_revision_fqdn="$(az containerapp revision show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_APP" \
            --revision "$previous_revision" \
            --query 'properties.fqdn' \
            --output tsv)"
          test -n "$previous_revision_fqdn"
          previous_ref_fingerprint="$(jq -c '[.[] | select(.secretRef != null) | [.name, .secretRef]] | sort' <<< "$current_environment" | sha256sum | cut -d ' ' -f 1)"
          current_service_ref="$(jq -r '.[] | select(.name == "SUPABASE_SERVICE_ROLE_KEY") | .secretRef // empty' <<< "$current_environment")"
          current_encryption_ref="$(jq -r '.[] | select(.name == "APP_ENCRYPTION_KEY") | .secretRef // empty' <<< "$current_environment")"
          current_cron_ref="$(jq -r '.[] | select(.name == "CRON_SECRET") | .secretRef // empty' <<< "$current_environment")"
          current_slack_allowed_ref="$(jq -r '.[] | select(.name == "SLACK_ALLOWED_WEBHOOK_SHA256") | .secretRef // empty' <<< "$current_environment")"
          current_reservation_mode="$(jq -r '.[] | select(.name == "DAILY_DIGEST_RESERVATION_MODE") | .value // empty' <<< "$current_environment")"
          current_release_sha="$(jq -r '.[] | select(.name == "COMPLIANCEHUB_RELEASE_SHA") | .value // empty' <<< "$current_environment")"
          if [ "$ROLLOUT_PHASE" = "bridge" ]; then
            # BRIDGE_REF_POLICY_BEGIN
            if [ -z "$current_service_ref" ] && [ -z "$current_encryption_ref" ] && [ -z "$current_cron_ref" ] && [ -z "$current_slack_allowed_ref" ]; then
              current_slot=""
              secret_slot="a"
            elif [ "$current_service_ref" = "supabase-service-role-a" ] \
              && [ "$current_encryption_ref" = "app-encryption-a" ] \
              && [ "$current_cron_ref" = "cron-secret-a" ] \
              && { [ -z "$current_slack_allowed_ref" ] || [ "$current_slack_allowed_ref" = "slack-allowed-webhook-a" ]; }; then
              current_slot="a"
              secret_slot="b"
            elif [ "$current_service_ref" = "supabase-service-role-b" ] \
              && [ "$current_encryption_ref" = "app-encryption-b" ] \
              && [ "$current_cron_ref" = "cron-secret-b" ] \
              && { [ -z "$current_slack_allowed_ref" ] || [ "$current_slack_allowed_ref" = "slack-allowed-webhook-b" ]; }; then
              current_slot="b"
              secret_slot="a"
            else
              exit 1
            fi
            # BRIDGE_REF_POLICY_END
          else
            # FINAL_REF_POLICY_BEGIN
            if [ "$current_service_ref" = "supabase-service-role-a" ] \
              && [ "$current_encryption_ref" = "app-encryption-a" ] \
              && [ "$current_cron_ref" = "cron-secret-a" ] \
              && [ "$current_slack_allowed_ref" = "slack-allowed-webhook-a" ]; then
              current_slot="a"
              secret_slot="b"
            elif [ "$current_service_ref" = "supabase-service-role-b" ] \
              && [ "$current_encryption_ref" = "app-encryption-b" ] \
              && [ "$current_cron_ref" = "cron-secret-b" ] \
              && [ "$current_slack_allowed_ref" = "slack-allowed-webhook-b" ]; then
              current_slot="b"
              secret_slot="a"
            else
              exit 1
            fi
            # FINAL_REF_POLICY_END
          fi
          github_ref_count="$(jq '[.[] | select(.name | startswith("GITHUB_"))] | length' <<< "$current_environment")"
          github_ref_names="$(jq -r '[.[] | select(.name | startswith("GITHUB_")) | .name] | sort | join(",")' <<< "$current_environment")"
          expected_github_ref_names="$(
            printf '%s,' \
              GITHUB_ALLOWED_ACCOUNT_ID \
              GITHUB_APPROVED_SECURITY_WORKFLOW_IDS \
              GITHUB_APP_CLIENT_ID \
              GITHUB_APP_CLIENT_SECRET \
              GITHUB_APP_ID \
              GITHUB_APP_PRIVATE_KEY \
              GITHUB_APP_SLUG \
              GITHUB_WEBHOOK_SECRET \
            | sed 's/,$//'
          )"
          while IFS=$'\t' read -r variable reference; do
            [ -z "$variable" ] && continue
            case "$variable" in
              GITHUB_APP_ID) expected="github-app-id-$current_slot" ;;
              GITHUB_APP_CLIENT_ID) expected="github-client-id-$current_slot" ;;
              GITHUB_APP_CLIENT_SECRET) expected="github-client-secret-$current_slot" ;;
              GITHUB_APP_PRIVATE_KEY) expected="github-private-key-$current_slot" ;;
              GITHUB_WEBHOOK_SECRET) expected="github-webhook-secret-$current_slot" ;;
              GITHUB_APP_SLUG) expected="github-app-slug-$current_slot" ;;
              GITHUB_ALLOWED_ACCOUNT_ID) expected="github-allowed-account-id-$current_slot" ;;
              GITHUB_APPROVED_SECURITY_WORKFLOW_IDS) expected="github-approved-workflow-ids-$current_slot" ;;
              *) exit 1 ;;
            esac
            test "$reference" = "$expected"
          done < <(jq -r '.[] | select(.name | startswith("GITHUB_")) | [.name, (.secretRef // "")] | @tsv' <<< "$current_environment")
          if [ "$github_ref_count" -eq 0 ]; then
            test -z "$github_ref_names"
          elif [ "$github_ref_count" -eq 8 ]; then
            test "$github_ref_names" = "$expected_github_ref_names"
          else
            exit 1
          fi
          verify_previous_capability="false"
          if [ "$ROLLOUT_PHASE" = "final" ]; then
            case "$current_reservation_mode" in
              bridge|strict) ;;
              *) exit 1 ;;
            esac
            [[ "$current_release_sha" =~ ^[0-9a-f]{40}$ ]]
            verify_previous_capability="true"
          elif [ -n "$current_reservation_mode" ] || [ -n "$current_release_sha" ]; then
            test "$current_reservation_mode" = "bridge"
            [[ "$current_release_sha" =~ ^[0-9a-f]{40}$ ]]
            rollback_capability_required="true"
            verify_previous_capability="true"
          fi
          if [ "$verify_previous_capability" = "true" ]; then
            previous_health="$(curl --fail-with-body --retry 5 --retry-all-errors --retry-delay 5 --retry-max-time 120 --connect-timeout 10 --max-time 120 "https://$previous_revision_fqdn/api/health/live")"
            jq --exit-status \
              --arg reservationMode "$current_reservation_mode" \
              --arg releaseSha "$current_release_sha" \
              '.status == "ok"
                and .slackDestinationPolicy == "v1"
                and .dailyDigestReservationMode == $reservationMode
                and .releaseSha == $releaseSha
                and (keys | sort) == (["dailyDigestReservationMode","releaseSha","slackDestinationPolicy","status"] | sort)' \
              <<< "$previous_health" >/dev/null
            confirmed_revision="$(az containerapp show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_CONTAINER_APP" \
              --query properties.latestReadyRevisionName \
              --output tsv)"
            test "$confirmed_revision" = "$previous_revision"
            confirmed_image="$(az containerapp revision show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_CONTAINER_APP" \
              --revision "$previous_revision" \
              --query 'properties.template.containers[0].image' \
              --output tsv)"
            test "$confirmed_image" = "$previous_image"
          fi
          {
            echo "previous-revision=$previous_revision"
            echo "previous-image=$previous_image"
            echo "previous-revision-fqdn=$previous_revision_fqdn"
            echo "previous-ref-fingerprint=$previous_ref_fingerprint"
            echo "previous-release-sha=$current_release_sha"
            echo "previous-reservation-mode=$current_reservation_mode"
            echo "rollback-capability-required=$rollback_capability_required"
            echo "runtime-reservation-mode=$runtime_reservation_mode"
            echo "expected-migration-version=$expected_migration_version"
            echo "service-role-ref=supabase-service-role-$secret_slot"
            echo "encryption-ref=app-encryption-$secret_slot"
            echo "cron-ref=cron-secret-$secret_slot"
            echo "slack-allowed-ref=slack-allowed-webhook-$secret_slot"
            echo "github-slot=github-app-$secret_slot"
            echo "github-app-id-ref=github-app-id-$secret_slot"
            echo "github-client-id-ref=github-client-id-$secret_slot"
            echo "github-client-secret-ref=github-client-secret-$secret_slot"
            echo "github-private-key-ref=github-private-key-$secret_slot"
            echo "github-webhook-secret-ref=github-webhook-secret-$secret_slot"
            echo "github-app-slug-ref=github-app-slug-$secret_slot"
            echo "github-allowed-account-id-ref=github-allowed-account-id-$secret_slot"
            echo "github-approved-workflow-ids-ref=github-approved-workflow-ids-$secret_slot"
          } >> "$GITHUB_OUTPUT"

      - name: Stage rollback-safe secret slot
        id: stage
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_ENCRYPTION_KEY: ${{ secrets.APP_ENCRYPTION_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SLACK_ALLOWED_WEBHOOK_SHA256: ${{ secrets.SLACK_ALLOWED_WEBHOOK_SHA256 }}
          GITHUB_APP_ID: ${{ secrets.AZURE_GITHUB_APP_ID }}
          GITHUB_APP_CLIENT_ID: ${{ secrets.AZURE_GITHUB_APP_CLIENT_ID }}
          GITHUB_APP_CLIENT_SECRET: ${{ secrets.AZURE_GITHUB_APP_CLIENT_SECRET }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.AZURE_GITHUB_APP_PRIVATE_KEY }}
          GITHUB_WEBHOOK_SECRET: ${{ secrets.AZURE_GITHUB_WEBHOOK_SECRET }}
          GITHUB_APP_SLUG: ${{ secrets.AZURE_GITHUB_APP_SLUG }}
          GITHUB_ALLOWED_ACCOUNT_ID: ${{ secrets.AZURE_GITHUB_ALLOWED_ACCOUNT_ID }}
          GITHUB_APPROVED_SECURITY_WORKFLOW_IDS: ${{ secrets.AZURE_GITHUB_APPROVED_SECURITY_WORKFLOW_IDS }}
          SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          CANONICAL_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          REGISTERED_GITHUB_APP_SITE_URL: ${{ vars.REGISTERED_GITHUB_APP_SITE_URL }}
          HOSTED_SUPABASE_PROJECT_REF: ${{ vars.HOSTED_SUPABASE_PROJECT_REF }}
          HOSTED_SUPABASE_MIGRATION_VERSION: ${{ vars.HOSTED_SUPABASE_MIGRATION_VERSION }}
        run: |
          set -euo pipefail
          required_values=(
            "$SUPABASE_SERVICE_ROLE_KEY"
            "$APP_ENCRYPTION_KEY"
            "$CRON_SECRET"
            "$SLACK_ALLOWED_WEBHOOK_SHA256"
            "$GITHUB_APP_ID"
            "$GITHUB_APP_CLIENT_ID"
            "$GITHUB_APP_CLIENT_SECRET"
            "$GITHUB_APP_PRIVATE_KEY"
            "$GITHUB_WEBHOOK_SECRET"
            "$GITHUB_APP_SLUG"
            "$GITHUB_ALLOWED_ACCOUNT_ID"
            "$GITHUB_APPROVED_SECURITY_WORKFLOW_IDS"
            "$SUPABASE_URL"
            "$CANONICAL_SITE_URL"
            "$REGISTERED_GITHUB_APP_SITE_URL"
            "$HOSTED_SUPABASE_PROJECT_REF"
            "$HOSTED_SUPABASE_MIGRATION_VERSION"
          )
          for required_value in "${required_values[@]}"; do
            test -n "$required_value"
          done
          [[ "$HOSTED_SUPABASE_PROJECT_REF" =~ ^[a-z0-9]{20}$ ]]
          test "$SUPABASE_URL" = "https://$HOSTED_SUPABASE_PROJECT_REF.supabase.co"
          test "$HOSTED_SUPABASE_MIGRATION_VERSION" = "${{ steps.rollout.outputs.expected-migration-version }}"
          test "$REGISTERED_GITHUB_APP_SITE_URL" = "$CANONICAL_SITE_URL"
          container_app_fqdn="$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_APP" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)"
          test -n "$container_app_fqdn"
          test "$CANONICAL_SITE_URL" = "https://$container_app_fqdn"
          [[ "$GITHUB_APP_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SLACK_ALLOWED_WEBHOOK_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$GITHUB_ALLOWED_ACCOUNT_ID" =~ ^[1-9][0-9]*$ ]]
          test "${#GITHUB_ALLOWED_ACCOUNT_ID}" -le 16
          (( 10#$GITHUB_ALLOWED_ACCOUNT_ID <= 9007199254740991 ))
          IFS=',' read -r -a approved_workflow_ids <<< "$GITHUB_APPROVED_SECURITY_WORKFLOW_IDS"
          test "${#approved_workflow_ids[@]}" -ge 1
          test "${#approved_workflow_ids[@]}" -le 20
          declare -A seen_workflow_ids=()
          for workflow_id in "${approved_workflow_ids[@]}"; do
            [[ "$workflow_id" =~ ^[1-9][0-9]*$ ]]
            test "${#workflow_id}" -le 16
            (( 10#$workflow_id <= 9007199254740991 ))
            test -z "${seen_workflow_ids[$workflow_id]+x}"
            seen_workflow_ids[$workflow_id]=1
          done
          [[ "$GITHUB_APP_PRIVATE_KEY" != *$'\n'* ]]
          private_key_label='PRIVATE KEY'
          pkcs8_header="$(printf '%s' '-----BEGIN ' "$private_key_label" '-----\n')"
          pkcs8_footer="$(printf '%s' '\n-----END ' "$private_key_label" '-----')"
          [[ "$GITHUB_APP_PRIVATE_KEY" == "$pkcs8_header"* ]]
          [[ "$GITHUB_APP_PRIVATE_KEY" == *"$pkcs8_footer" ]]
          # PRE_MUTATION_REVALIDATION_BEGIN
          unchanged_revision="$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_APP" \
            --query properties.latestReadyRevisionName \
            --output tsv)"
          test "$unchanged_revision" = "${{ steps.rollout.outputs.previous-revision }}"
          unchanged_image="$(az containerapp revision show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_APP" \
            --revision "${{ steps.rollout.outputs.previous-revision }}" \
            --query 'properties.template.containers[0].image' \
            --output tsv)"
          test "$unchanged_image" = "${{ steps.rollout.outputs.previous-image }}"
          unchanged_environment="$(az containerapp revision show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_APP" \
            --revision "${{ steps.rollout.outputs.previous-revision }}" \
            --query 'properties.template.containers[0].env' \
            --output json)"
          unchanged_ref_fingerprint="$(jq -c '[.[] | select(.secretRef != null) | [.name, .secretRef]] | sort' <<< "$unchanged_environment" | sha256sum | cut -d ' ' -f 1)"
          test "$unchanged_ref_fingerprint" = "${{ steps.rollout.outputs.previous-ref-fingerprint }}"
          # PRE_MUTATION_REVALIDATION_END
          az containerapp secret set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_APP" \
            --secrets \
              "${{ steps.rollout.outputs.service-role-ref }}=$SUPABASE_SERVICE_ROLE_KEY" \
              "${{ steps.rollout.outputs.encryption-ref }}=$APP_ENCRYPTION_KEY" \
              "${{ steps.rollout.outputs.cron-ref }}=$CRON_SECRET" \
              "${{ steps.rollout.outputs.slack-allowed-ref }}=$SLACK_ALLOWED_WEBHOOK_SHA256" \
              "${{ steps.rollout.outputs.github-app-id-ref }}=$GITHUB_APP_ID" \
              "${{ steps.rollout.outputs.github-client-id-ref }}=$GITHUB_APP_CLIENT_ID" \
              "${{ steps.rollout.outputs.github-client-secret-ref }}=$GITHUB_APP_CLIENT_SECRET" \
              "${{ steps.rollout.outputs.github-private-key-ref }}=$GITHUB_APP_PRIVATE_KEY" \
              "${{ steps.rollout.outputs.github-webhook-secret-ref }}=$GITHUB_WEBHOOK_SECRET" \
              "${{ steps.rollout.outputs.github-app-slug-ref }}=$GITHUB_APP_SLUG" \
              "${{ steps.rollout.outputs.github-allowed-account-id-ref }}=$GITHUB_ALLOWED_ACCOUNT_ID" \
              "${{ steps.rollout.outputs.github-approved-workflow-ids-ref }}=$GITHUB_APPROVED_SECURITY_WORKFLOW_IDS" \
            --only-show-errors \
            --output none
          echo "mutation-started=true" >> "$GITHUB_OUTPUT"

      - name: Create rollout revision from the previous healthy revision
        id: revision
        env:
          IMAGE_REFERENCE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.publish.outputs.image-digest }}
        run: |
          set -euo pipefail
          runtime_reservation_mode="${{ steps.rollout.outputs.runtime-reservation-mode }}"
          new_revision="$(az containerapp revision copy \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_APP" \
            --from-revision "${{ steps.rollout.outputs.previous-revision }}" \
            --image "$IMAGE_REFERENCE" \
            --revision-suffix "run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --cpu 0.5 \
            --memory 1Gi \
            --min-replicas 0 \
            --max-replicas 1 \
            --replace-env-vars \
              "NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}" \
              "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
              "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}" \
              "NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}" \
              "MCP_RESOURCE_URL=${{ vars.MCP_RESOURCE_URL }}" \
              "SUPABASE_OAUTH_ISSUER=${{ vars.SUPABASE_OAUTH_ISSUER }}" \
              "SUPABASE_OAUTH_JWKS_URL=${{ vars.SUPABASE_OAUTH_JWKS_URL }}" \
              "MCP_JWT_ALGORITHMS=${{ vars.MCP_JWT_ALGORITHMS }}" \
              "DAILY_DIGEST_RESERVATION_MODE=$runtime_reservation_mode" \
              "COMPLIANCEHUB_RELEASE_SHA=$DEPLOY_SHA" \
              "SUPABASE_SERVICE_ROLE_KEY=secretref:${{ steps.rollout.outputs.service-role-ref }}" \
              "APP_ENCRYPTION_KEY=secretref:${{ steps.rollout.outputs.encryption-ref }}" \
              "CRON_SECRET=secretref:${{ steps.rollout.outputs.cron-ref }}" \
              "SLACK_ALLOWED_WEBHOOK_SHA256=secretref:${{ steps.rollout.outputs.slack-allowed-ref }}" \
              "GITHUB_APP_ID=secretref:${{ steps.rollout.outputs.github-app-id-ref }}" \
              "GITHUB_APP_CLIENT_ID=secretref:${{ steps.rollout.outputs.github-client-id-ref }}" \
              "GITHUB_APP_CLIENT_SECRET=secretref:${{ steps.rollout.outputs.github-client-secret-ref }}" \
              "GITHUB_APP_PRIVATE_KEY=secretref:${{ steps.rollout.outputs.github-private-key-ref }}" \
              "GITHUB_WEBHOOK_SECRET=secretref:${{ steps.rollout.outputs.github-webhook-secret-ref }}" \
              "GITHUB_APP_SLUG=secretref:${{ steps.rollout.outputs.github-app-slug-ref }}" \
              "GITHUB_ALLOWED_ACCOUNT_ID=secretref:${{ steps.rollout.outputs.github-allowed-account-id-ref }}" \
              "GITHUB_APPROVED_SECURITY_WORKFLOW_IDS=secretref:${{ steps.rollout.outputs.github-approved-workflow-ids-ref }}" \
            --only-show-errors \
            --query properties.latestRevisionName \
            --output tsv)"
          test "$new_revision" = "${AZURE_CONTAINER_APP}--run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          health_state=""
          running_state=""
          for _ in $(seq 1 60); do
            read -r health_state running_state < <(az containerapp revision show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_CONTAINER_APP" \
              --revision "$new_revision" \
              --query '[properties.healthState, properties.runningState]' \
              --output tsv)
            if [ "$health_state" = "Healthy" ] && [ "$running_state" = "Running" ]; then
              break
            fi
            sleep 5
          done
          test "$health_state" = "Healthy"
          test "$running_state" = "Running"
          latest_ready_revision="$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_APP" \
            --query properties.latestReadyRevisionName \
            --output tsv)"
          test "$latest_ready_revision" = "$new_revision"
          new_revision_fqdn="$(az containerapp revision show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_APP" \
            --revision "$new_revision" \
            --query 'properties.fqdn' \
            --output tsv)"
          test -n "$new_revision_fqdn"
          echo "new-revision-fqdn=$new_revision_fqdn" >> "$GITHUB_OUTPUT"

      - name: Verify deployed health and OAuth/MCP contract
        env:
          AUTHORIZATION_SERVER: ${{ vars.SUPABASE_OAUTH_ISSUER }}
          CANONICAL_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        run: |
          set -euo pipefail
          origin="$CANONICAL_SITE_URL"
          revision_origin="https://${{ steps.revision.outputs.new-revision-fqdn }}"
          runtime_reservation_mode="${{ steps.rollout.outputs.runtime-reservation-mode }}"
          live_health="$(curl --fail-with-body --retry 5 --retry-all-errors --retry-delay 5 --retry-max-time 120 --connect-timeout 10 --max-time 120 "$revision_origin/api/health/live")"
          jq --exit-status \
            --arg policy "v1" \
            --arg reservationMode "$runtime_reservation_mode" \
            --arg releaseSha "$DEPLOY_SHA" \
            '.status == "ok"
              and .slackDestinationPolicy == $policy
              and .dailyDigestReservationMode == $reservationMode
              and .releaseSha == $releaseSha
              and (keys | sort) == (["dailyDigestReservationMode","releaseSha","slackDestinationPolicy","status"] | sort)' \
            <<< "$live_health" >/dev/null
          ready_health="$(curl --fail-with-body --retry 5 --retry-all-errors --retry-delay 5 --retry-max-time 120 --connect-timeout 10 --max-time 120 "$revision_origin/api/health")"
          jq --exit-status \
            --arg policy "v1" \
            --arg reservationMode "$runtime_reservation_mode" \
            --arg releaseSha "$DEPLOY_SHA" \
            '.status == "ok"
              and .db == "ok"
              and (.ms | type) == "number"
              and .slackDestinationPolicy == $policy
              and .dailyDigestReservationMode == $reservationMode
              and .releaseSha == $releaseSha
              and (keys | sort) == (["dailyDigestReservationMode","db","ms","releaseSha","slackDestinationPolicy","status"] | sort)' \
            <<< "$ready_health" >/dev/null
          curl --fail-with-body --retry 5 --retry-all-errors --retry-delay 5 --retry-max-time 120 --connect-timeout 10 --max-time 120 \
            "$origin/.well-known/oauth-protected-resource" | jq --exit-status \
            --arg resource "$origin/mcp" \
            --arg authorizationServer "$AUTHORIZATION_SERVER" \
            '.resource == $resource and .authorization_servers == [$authorizationServer] and .scopes_supported == ["openid", "email", "profile"]'
          headers_file="$(mktemp "$RUNNER_TEMP/compliancehub-mcp-headers.XXXXXX")"
          trap 'rm -f "$headers_file"' EXIT
          mcp_status="$(curl --silent --show-error \
            --connect-timeout 10 \
            --max-time 120 \
            --output /dev/null \
            --dump-header "$headers_file" \
            --write-out '%{http_code}' \
            --request POST \
            --header 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"deploy-smoke","version":"1.0.0"}}}' \
            "$origin/mcp")"
          test "$mcp_status" = "401"
          tr -d '\r' < "$headers_file" | grep --fixed-strings --ignore-case \
            "www-authenticate: Bearer resource_metadata=\"$origin/.well-known/oauth-protected-resource\""

      - name: Restore the previous healthy revision after a failed rollout
        if: (failure() || cancelled()) && steps.rollout.outputs.previous-revision != '' && steps.stage.outputs.mutation-started == 'true'
        env:
          CANONICAL_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        run: |
          set -euo pipefail
          rollback_capability_required="${{ steps.rollout.outputs.rollback-capability-required }}"
          rollback_revision="$(az containerapp revision copy \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_APP" \
            --from-revision "${{ steps.rollout.outputs.previous-revision }}" \
            --revision-suffix "rollback-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --only-show-errors \
            --query properties.latestRevisionName \
            --output tsv)"
          test "$rollback_revision" = "${AZURE_CONTAINER_APP}--rollback-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          health_state=""
          running_state=""
          for _ in $(seq 1 60); do
            read -r health_state running_state < <(az containerapp revision show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_CONTAINER_APP" \
              --revision "$rollback_revision" \
              --query '[properties.healthState, properties.runningState]' \
              --output tsv)
            if [ "$health_state" = "Healthy" ] && [ "$running_state" = "Running" ]; then
              break
            fi
            sleep 5
          done
          test "$health_state" = "Healthy"
          test "$running_state" = "Running"
          rollback_image="$(az containerapp revision show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_APP" \
            --revision "$rollback_revision" \
            --query 'properties.template.containers[0].image' \
            --output tsv)"
          test "$rollback_image" = "${{ steps.rollout.outputs.previous-image }}"
          rollback_revision_fqdn="$(az containerapp revision show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_APP" \
            --revision "$rollback_revision" \
            --query 'properties.fqdn' \
            --output tsv)"
          test -n "$rollback_revision_fqdn"
          rollback_environment="$(az containerapp revision show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_APP" \
            --revision "$rollback_revision" \
            --query 'properties.template.containers[0].env' \
            --output json)"
          rollback_ref_fingerprint="$(jq -c '[.[] | select(.secretRef != null) | [.name, .secretRef]] | sort' <<< "$rollback_environment" | sha256sum | cut -d ' ' -f 1)"
          test "$rollback_ref_fingerprint" = "${{ steps.rollout.outputs.previous-ref-fingerprint }}"
          latest_ready_revision="$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_APP" \
            --query properties.latestReadyRevisionName \
            --output tsv)"
          test "$latest_ready_revision" = "$rollback_revision"
          rollback_live_health="$(curl --fail-with-body --retry 5 --retry-all-errors --retry-delay 5 --retry-max-time 120 --connect-timeout 10 --max-time 120 "https://$rollback_revision_fqdn/api/health/live")"
          if [ "$rollback_capability_required" = "true" ]; then
            jq --exit-status \
              --arg reservationMode "${{ steps.rollout.outputs.previous-reservation-mode }}" \
              --arg releaseSha "${{ steps.rollout.outputs.previous-release-sha }}" \
              '.status == "ok"
                and .slackDestinationPolicy == "v1"
                and .dailyDigestReservationMode == $reservationMode
                and .releaseSha == $releaseSha' \
              <<< "$rollback_live_health" >/dev/null
          else
            test "$ROLLOUT_PHASE" = "bridge"
          fi
          curl --fail-with-body --retry 5 --retry-all-errors --retry-delay 5 --retry-max-time 120 --connect-timeout 10 --max-time 120 "$CANONICAL_SITE_URL/api/health" >/dev/null
