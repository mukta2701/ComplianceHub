name: Deploy Azure staging

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to Azure after publishing the image
        required: true
        type: boolean
        default: true
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: compliancehub-azure-staging
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mukta2701/compliancehub
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  AZURE_CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP }}
  AZURE_CONTAINER_ENVIRONMENT: ${{ vars.AZURE_CONTAINER_ENVIRONMENT }}
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify application
        run: npm run verify
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and publish immutable image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEPLOY_SHA }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    if: github.event_name == 'workflow_run' || inputs.deploy
    runs-on: ubuntu-latest
    environment: azure-staging
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Log in to Azure with OIDC
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Capture rollback revision and select inactive secret slot
        id: rollout
        run: |
          previous_revision="$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_APP" \
            --query properties.latestReadyRevisionName \
            --output tsv)"
          current_service_ref=""
          if [ -n "$previous_revision" ]; then
            current_service_ref="$(az containerapp revision show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_CONTAINER_APP" \
              --revision "$previous_revision" \
              --query 'properties.template.containers[0].env' \
              --output json | jq -r '.[] | select(.name == "SUPABASE_SERVICE_ROLE_KEY") | .secretRef // empty')"
          fi
          if [ "$current_service_ref" = "supabase-service-role-a" ]; then
            secret_slot="b"
          else
            secret_slot="a"
          fi
          {
            echo "previous-revision=$previous_revision"
            echo "service-role-ref=supabase-service-role-$secret_slot"
            echo "encryption-ref=app-encryption-$secret_slot"
            echo "cron-ref=cron-secret-$secret_slot"
          } >> "$GITHUB_OUTPUT"

      - name: Stage rollback-safe secret slot
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_ENCRYPTION_KEY: ${{ secrets.APP_ENCRYPTION_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          az containerapp secret set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_APP" \
            --secrets \
              "${{ steps.rollout.outputs.service-role-ref }}=$SUPABASE_SERVICE_ROLE_KEY" \
              "${{ steps.rollout.outputs.encryption-ref }}=$APP_ENCRYPTION_KEY" \
              "${{ steps.rollout.outputs.cron-ref }}=$CRON_SECRET" \
            --only-show-errors \
            --output none

      - name: Create rollout revision from the previous healthy revision
        env:
          IMAGE_REFERENCE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.publish.outputs.image-digest }}
        run: |
          az containerapp revision copy \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_APP" \
            --from-revision "${{ steps.rollout.outputs.previous-revision }}" \
            --image "$IMAGE_REFERENCE" \
            --revision-suffix "run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --cpu 0.5 \
            --memory 1Gi \
            --min-replicas 0 \
            --max-replicas 1 \
            --replace-env-vars \
              "NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}" \
              "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
              "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}" \
              "NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}" \
              "MCP_RESOURCE_URL=${{ vars.MCP_RESOURCE_URL }}" \
              "SUPABASE_OAUTH_ISSUER=${{ vars.SUPABASE_OAUTH_ISSUER }}" \
              "SUPABASE_OAUTH_JWKS_URL=${{ vars.SUPABASE_OAUTH_JWKS_URL }}" \
              "MCP_JWT_ALGORITHMS=${{ vars.MCP_JWT_ALGORITHMS }}" \
              "SUPABASE_SERVICE_ROLE_KEY=secretref:${{ steps.rollout.outputs.service-role-ref }}" \
              "APP_ENCRYPTION_KEY=secretref:${{ steps.rollout.outputs.encryption-ref }}" \
              "CRON_SECRET=secretref:${{ steps.rollout.outputs.cron-ref }}" \
            --only-show-errors \
            --output none

      - name: Verify deployed health and OAuth/MCP contract
        env:
          AUTHORIZATION_SERVER: ${{ vars.SUPABASE_OAUTH_ISSUER }}
        run: |
          fqdn="$(az containerapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_CONTAINER_APP" --query properties.configuration.ingress.fqdn --output tsv)"
          origin="https://${fqdn}"
          curl --fail-with-body --retry 5 --retry-all-errors --retry-delay 5 --max-time 120 "$origin/api/health/live"
          curl --fail-with-body --retry 5 --retry-all-errors --retry-delay 5 --max-time 120 "$origin/api/health"
          curl --fail-with-body --retry 5 --retry-all-errors --retry-delay 5 --max-time 120 \
            "$origin/.well-known/oauth-protected-resource" | jq --exit-status \
            --arg resource "$origin/mcp" \
            --arg authorizationServer "$AUTHORIZATION_SERVER" \
            '.resource == $resource and .authorization_servers == [$authorizationServer] and .scopes_supported == ["openid", "email", "profile"]'
          headers_file="$(mktemp "$RUNNER_TEMP/compliancehub-mcp-headers.XXXXXX")"
          trap 'rm -f "$headers_file"' EXIT
          mcp_status="$(curl --silent --show-error \
            --output /dev/null \
            --dump-header "$headers_file" \
            --write-out '%{http_code}' \
            --request POST \
            --header 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"deploy-smoke","version":"1.0.0"}}}' \
            "$origin/mcp")"
          test "$mcp_status" = "401"
          tr -d '\r' < "$headers_file" | grep --fixed-strings --ignore-case \
            "www-authenticate: Bearer resource_metadata=\"$origin/.well-known/oauth-protected-resource\""

      - name: Restore the previous healthy revision after a failed rollout
        if: failure() && steps.rollout.outputs.previous-revision != ''
        run: |
          az containerapp revision copy \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_APP" \
            --from-revision "${{ steps.rollout.outputs.previous-revision }}" \
            --revision-suffix "rollback-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --only-show-errors \
            --output none
          fqdn="$(az containerapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_CONTAINER_APP" --query properties.configuration.ingress.fqdn --output tsv)"
          curl --fail-with-body --retry 5 --retry-all-errors --retry-delay 5 --max-time 120 "https://${fqdn}/api/health/live"
          curl --fail-with-body --retry 5 --retry-all-errors --retry-delay 5 --max-time 120 "https://${fqdn}/api/health"
