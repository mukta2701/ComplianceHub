name: Deploy Azure staging

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to Azure after publishing the image
        required: true
        type: boolean
        default: true
  push:
    branches: [main, codex/internal-mcp-digest]
    paths:
      - "src/**"
      - "public/**"
      - "infra/azure/**"
      - "Dockerfile"
      - ".dockerignore"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-azure-staging.yml"

permissions:
  contents: read

concurrency:
  group: compliancehub-azure-staging
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mukta2701/compliancehub
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  AZURE_CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP }}
  AZURE_CONTAINER_ENVIRONMENT: ${{ vars.AZURE_CONTAINER_ENVIRONMENT }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify application
        run: npm run verify
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and publish immutable image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    if: >-
      github.ref == 'refs/heads/main' ||
      (github.ref == 'refs/heads/codex/internal-mcp-digest' && vars.GHCR_PUBLIC_READY == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy)
    runs-on: ubuntu-latest
    environment: azure-staging
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to Azure with OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy immutable image and configuration
        env:
          IMAGE_REFERENCE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.publish.outputs.image-digest }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_ENCRYPTION_KEY: ${{ secrets.APP_ENCRYPTION_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          parameters_file="$(mktemp "$RUNNER_TEMP/compliancehub-parameters.XXXXXX.json")"
          trap 'rm -f "$parameters_file"' EXIT
          chmod 600 "$parameters_file"
          jq --null-input \
            --arg managedEnvironmentName "$AZURE_CONTAINER_ENVIRONMENT" \
            --arg containerAppName "$AZURE_CONTAINER_APP" \
            --arg imageReference "$IMAGE_REFERENCE" \
            --arg revisionSuffix "run-${GITHUB_RUN_ID}" \
            --arg nextPublicSupabaseUrl "${{ vars.NEXT_PUBLIC_SUPABASE_URL }}" \
            --arg nextPublicSupabaseAnonKey "${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            --arg nextPublicSupabasePublishableKey "${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}" \
            --arg nextPublicSiteUrl "${{ vars.NEXT_PUBLIC_SITE_URL }}" \
            --arg mcpResourceUrl "${{ vars.MCP_RESOURCE_URL }}" \
            --arg supabaseOauthIssuer "${{ vars.SUPABASE_OAUTH_ISSUER }}" \
            --arg supabaseOauthJwksUrl "${{ vars.SUPABASE_OAUTH_JWKS_URL }}" \
            --arg mcpJwtAlgorithms "${{ vars.MCP_JWT_ALGORITHMS }}" \
            '{
              "$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#",
              contentVersion: "1.0.0.0",
              parameters: {
                managedEnvironmentName: { value: $managedEnvironmentName },
                containerAppName: { value: $containerAppName },
                imageReference: { value: $imageReference },
                revisionSuffix: { value: $revisionSuffix },
                nextPublicSupabaseUrl: { value: $nextPublicSupabaseUrl },
                nextPublicSupabaseAnonKey: { value: $nextPublicSupabaseAnonKey },
                nextPublicSupabasePublishableKey: { value: $nextPublicSupabasePublishableKey },
                nextPublicSiteUrl: { value: $nextPublicSiteUrl },
                mcpResourceUrl: { value: $mcpResourceUrl },
                supabaseOauthIssuer: { value: $supabaseOauthIssuer },
                supabaseOauthJwksUrl: { value: $supabaseOauthJwksUrl },
                mcpJwtAlgorithms: { value: $mcpJwtAlgorithms },
                supabaseServiceRoleKey: { value: env.SUPABASE_SERVICE_ROLE_KEY },
                appEncryptionKey: { value: env.APP_ENCRYPTION_KEY },
                cronSecret: { value: env.CRON_SECRET }
              }
            }' > "$parameters_file"
          az deployment group create \
            --name "compliancehub-${GITHUB_RUN_ID}" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/azure/application.bicep \
            --parameters "@$parameters_file" \
            --only-show-errors \
            --output none

      - name: Verify deployed liveness and readiness
        run: |
          fqdn="$(az containerapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_CONTAINER_APP" --query properties.configuration.ingress.fqdn --output tsv)"
          curl --fail-with-body --retry 5 --retry-all-errors --retry-delay 5 --max-time 120 "https://${fqdn}/api/health/live"
          curl --fail-with-body --retry 5 --retry-all-errors --retry-delay 5 --max-time 120 "https://${fqdn}/api/health"
