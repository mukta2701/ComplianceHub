name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      image: ${{ steps.filter.outputs.image }}
      db: ${{ steps.filter.outputs.db }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'scripts/**'
              - 'e2e/**'
              - 'supabase/migrations/**'
              - 'package.json'
              - 'package-lock.json'
              - 'next.config.ts'
              - 'tsconfig.json'
              - 'vitest*.ts'
              - 'playwright.config.ts'
              - 'eslint.config.mjs'
              - 'postcss.config.mjs'
            image:
              - 'Dockerfile'
              - '.dockerignore'
              - 'package.json'
              - 'package-lock.json'
              - 'next.config.ts'
              - 'src/**'
            db:
              - 'supabase/**'

  container:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IMAGE_NEEDED: ${{ needs.changes.outputs.image == 'true' || github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: env.IMAGE_NEEDED == 'true'
        name: Build production container
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: compliancehub:ci
          platforms: linux/amd64
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co
            NEXT_PUBLIC_SUPABASE_ANON_KEY=ci-anon-key-placeholder-long
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=ci-publishable-key-placeholder-long
            NEXT_PUBLIC_SITE_URL=https://compliancehub-staging.example
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - if: env.IMAGE_NEEDED == 'true'
        name: Smoke test web image
        shell: bash
        run: |
          set -euo pipefail
          web_container="compliancehub-web-ci"
          docker run --detach --name "$web_container" --publish 3100:3100 \
            --env NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co \
            --env NEXT_PUBLIC_SUPABASE_ANON_KEY=ci-anon-key-placeholder-long \
            --env NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=ci-publishable-key-placeholder-long \
            compliancehub:ci
          trap 'docker rm --force "$web_container" >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if curl --silent --show-error --fail http://127.0.0.1:3100/api/health/live >/dev/null; then break; fi
            sleep 1
          done
          curl --silent --show-error --fail http://127.0.0.1:3100/api/health/live >/dev/null
          image_user="$(docker inspect --format '{{.Config.User}}' compliancehub:ci)"
          echo "container image user: [${image_user}]"
          test -n "$image_user"
          test "$image_user" != "root"
          test "$image_user" != "0"
          # The finite runner (dist/github-connection-reconcile.mjs via
          # build:runtimes) is planned Milestone 1 work and is not implemented
          # yet, so there is no runner assertion until it lands.
          ! docker history --no-trunc compliancehub:ci | grep -Eiq '-----BEGIN [A-Z ]*PRIVATE KEY-----[A-Za-z0-9+/=]{40,}'

  application:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HEAVY: ${{ needs.changes.outputs.code == 'true' || github.ref == 'refs/heads/main' }}
      E2E_ARGS: ${{ github.ref == 'refs/heads/main' && '' || '-- --project=chromium' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level high
      - run: npm run lint
      - run: npm run typecheck
      - if: env.HEAVY == 'true'
        run: npm test
      - if: env.HEAVY == 'true'
        run: npx playwright install chromium
      - if: env.HEAVY == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.0
      - if: env.HEAVY == 'true'
        name: Start local Supabase without logging credentials
        run: supabase start > "$RUNNER_TEMP/compliancehub-supabase-start.log" 2>&1
      - if: env.HEAVY == 'true'
        name: Configure local application environment
        run: |
          eval "$(supabase status -o env)"
          app_encryption_key="$(openssl rand -base64 32)"
          echo "::add-mask::$API_URL"
          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          echo "::add-mask::ci-test-cron-secret"
          echo "::add-mask::$app_encryption_key"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3100"
            echo "CRON_SECRET=ci-test-cron-secret"
            echo "APP_ENCRYPTION_KEY=$app_encryption_key"
            echo "E2E_TEST_TOOLS_ENABLED=1"
            echo "SLACK_ALLOWED_WEBHOOK_SHA256=36b243d5b0e2304cbdf6f5bf362061b4f0e5cdc842c7f407af9253d0207cce52"
          } >> "$GITHUB_ENV"
      - if: env.HEAVY == 'true'
        run: npm run build
      - if: env.HEAVY == 'true'
        run: npm run test:integration
      - if: env.HEAVY == 'true'
        run: npm run test:e2e $E2E_ARGS

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  database:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_NEEDED: ${{ needs.changes.outputs.db == 'true' || github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.0
      - if: env.DB_NEEDED == 'true'
        name: Start local Supabase without logging credentials
        run: supabase start > "$RUNNER_TEMP/compliancehub-supabase-start.log" 2>&1
      - if: env.DB_NEEDED == 'true'
        run: bash scripts/test-db-upgrade.sh
      - if: env.DB_NEEDED == 'true'
        run: supabase test db
