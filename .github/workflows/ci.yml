name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      image: ${{ steps.filter.outputs.image }}
      db: ${{ steps.filter.outputs.db }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'scripts/**'
              - 'e2e/**'
              - 'supabase/migrations/**'
              - 'package.json'
              - 'package-lock.json'
              - 'next.config.ts'
              - 'tsconfig.json'
              - 'vitest*.ts'
              - 'playwright.config.ts'
              - 'eslint.config.mjs'
              - 'postcss.config.mjs'
            image:
              - 'Dockerfile'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
              - 'package.json'
              - 'package-lock.json'
              - 'next.config.ts'
              - 'tsconfig.json'
              - 'scripts/build-runtime-bundles.ts'
              - 'scripts/github-connection-reconcile.ts'
              - 'scripts/github-compliance-collect.ts'
              - 'src/**'
            db:
              - 'supabase/**'

  container:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IMAGE_NEEDED: ${{ needs.changes.outputs.image == 'true' || github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: env.IMAGE_NEEDED == 'true'
        name: Build production container
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: compliancehub:ci
          platforms: linux/amd64
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co
            NEXT_PUBLIC_SUPABASE_ANON_KEY=ci-anon-key-placeholder-long
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=ci-publishable-key-placeholder-long
            NEXT_PUBLIC_SITE_URL=https://compliancehub-staging.example
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - if: env.IMAGE_NEEDED == 'true'
        name: Smoke test web image
        shell: bash
        run: |
          set -euo pipefail
          web_container="compliancehub-web-ci"
          docker run --detach --name "$web_container" --publish 3100:3100 \
            --env NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co \
            --env NEXT_PUBLIC_SUPABASE_ANON_KEY=ci-anon-key-placeholder-long \
            --env NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=ci-publishable-key-placeholder-long \
            compliancehub:ci
          trap 'docker rm --force "$web_container" >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if curl --silent --show-error --fail http://127.0.0.1:3100/api/health/live >/dev/null; then break; fi
            sleep 1
          done
          curl --silent --show-error --fail http://127.0.0.1:3100/api/health/live >/dev/null
          image_user="$(docker inspect --format '{{.Config.User}}' compliancehub:ci)"
          echo "container image user: [${image_user}]"
          test -n "$image_user"
          test "$image_user" != "root"
          test "$image_user" != "0"

          fixture_network="compliancehub-runner-ci"
          fixture_container="compliancehub-runner-store-ci"
          bundle_container=""
          runner_log="$RUNNER_TEMP/github-connection-reconcile.log"
          daily_runner_log="$RUNNER_TEMP/github-compliance-collect.log"
          image_scan="$RUNNER_TEMP/compliancehub-image-inspection.txt"
          copied_bundle="$RUNNER_TEMP/github-connection-reconcile.mjs"
          copied_daily_bundle="$RUNNER_TEMP/github-compliance-collect.mjs"
          fixture_secret="task8-container-fixture-secret"
          fixture_encryption_marker="task8-container-encryption-marker"
          fixture_slack_digest_marker="task8-container-slack-digest-marker"
          private_key_pem="$(openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 2>/dev/null)"
          private_key="$(printf '%s\n' "$private_key_pem" | awk '{printf "%s\\n", $0}')"
          private_key_marker="$(printf '%s\n' "$private_key_pem" | sed -n '2p')"
          cleanup_runner_smoke() {
            if [ -n "$bundle_container" ]; then docker rm --force "$bundle_container" >/dev/null 2>&1 || true; fi
            docker rm --force "$fixture_container" >/dev/null 2>&1 || true
            docker network rm "$fixture_network" >/dev/null 2>&1 || true
          }
          trap 'cleanup_runner_smoke; docker rm --force "$web_container" >/dev/null 2>&1 || true' EXIT

          docker network create "$fixture_network" >/dev/null
          docker run --detach --name "$fixture_container" --network "$fixture_network" \
            compliancehub:ci node -e 'require("node:http").createServer((request,response)=>{const body=request.url==="/rest/v1/rpc/claim_github_connection_alert_delivery"?"[]":"[]";response.writeHead(200,{"content-type":"application/json"});response.end(body)}).listen(4400,"0.0.0.0")'
          for attempt in {1..20}; do
            if docker exec "$fixture_container" node -e 'fetch("http://127.0.0.1:4400").then(response=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))'; then break; fi
            sleep 0.25
          done
          docker exec "$fixture_container" node -e 'fetch("http://127.0.0.1:4400").then(response=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))'

          set +e
          timeout 15s docker run --rm --network "$fixture_network" \
            --env NODE_ENV=development \
            --env NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3100 \
            --env NEXT_PUBLIC_SUPABASE_URL=http://compliancehub-runner-store-ci:4400 \
            --env SUPABASE_SERVICE_ROLE_KEY="$fixture_secret" \
            --env GITHUB_APP_ID=1 \
            --env GITHUB_APP_SLUG=fictional-app \
            --env GITHUB_APP_CLIENT_ID=fictional-client \
            --env GITHUB_APP_CLIENT_SECRET="$fixture_secret" \
            --env GITHUB_APP_PRIVATE_KEY="$private_key" \
            --env GITHUB_WEBHOOK_SECRET="$fixture_secret" \
            --env GITHUB_ALLOWED_ACCOUNT_ID=99 \
            --env GITHUB_ALLOWED_ACCOUNT_TYPE=User \
            --env GITHUB_CONNECTION_MAX_WEBHOOK_DELIVERIES=1 \
            --env GITHUB_CONNECTION_MAX_INSTALLATIONS=1 \
            --env GITHUB_CONNECTION_MAX_SLACK_DELIVERIES=1 \
            --env GITHUB_CONNECTION_TIME_BUDGET_MS=5000 \
            --env APP_ENCRYPTION_KEY="$fixture_encryption_marker" \
            --env SLACK_ALLOWED_WEBHOOK_SHA256="$fixture_slack_digest_marker" \
            compliancehub:ci node dist/github-connection-reconcile.mjs >"$runner_log" 2>&1
          runner_status=$?
          set -e
          cat "$runner_log"
          test "$runner_status" -eq 0
          grep -Fq -- 'webhookDeliveriesClaimed=0 installationsClaimed=0' "$runner_log"
          grep -Fq -- 'slackClaimed=0 slackDelivered=0 slackFailed=0' "$runner_log"

          set +e
          timeout 15s docker run --rm --network "$fixture_network" \
            --env NODE_ENV=production \
            --env NEXT_PUBLIC_SUPABASE_URL=http://compliancehub-runner-store-ci:4400 \
            --env NEXT_PUBLIC_SITE_URL=https://compliancehub-ci.example \
            --env SUPABASE_SERVICE_ROLE_KEY="$fixture_secret" \
            --env GITHUB_APP_ID=1 \
            --env GITHUB_APP_PRIVATE_KEY="$private_key" \
            --env GITHUB_APPROVED_SECURITY_WORKFLOW_IDS=1 \
            compliancehub:ci node dist/github-compliance-collect.mjs >"$daily_runner_log" 2>&1
          daily_runner_status=$?
          set -e
          test "$daily_runner_status" -eq 0
          grep -Fq -- '"event":"github_daily_collection"' "$daily_runner_log"
          grep -Fq -- '"complete":true' "$daily_runner_log"
          grep -Fq -- '"repositoriesChecked":0' "$daily_runner_log"

          docker history --no-trunc compliancehub:ci >"$image_scan"
          docker inspect --format '{{json .Config.Env}}' compliancehub:ci >>"$image_scan"
          bundle_container="$(docker create compliancehub:ci)"
          docker cp "$bundle_container:/app/dist/github-connection-reconcile.mjs" "$copied_bundle"
          docker cp "$bundle_container:/app/dist/github-compliance-collect.mjs" "$copied_daily_bundle"
          docker rm "$bundle_container" >/dev/null
          bundle_container=""

          assert_pattern_absent() {
            local mode="$1"
            local pattern="$2"
            shift 2
            set +e
            if [ "$mode" = fixed ]; then grep -Fq -- "$pattern" "$@"; else grep -Eiq -- "$pattern" "$@"; fi
            local scan_status=$?
            set -e
            case "$scan_status" in
              0) echo "Sensitive fixture material found in inspected container evidence" >&2; return 1 ;;
              1) return 0 ;;
              *) echo "Container evidence scan failed" >&2; return "$scan_status" ;;
            esac
          }
          assert_pattern_absent fixed "$fixture_secret" "$runner_log" "$daily_runner_log" "$image_scan" "$copied_bundle" "$copied_daily_bundle"
          assert_pattern_absent fixed "$fixture_encryption_marker" "$runner_log" "$daily_runner_log" "$image_scan" "$copied_bundle" "$copied_daily_bundle"
          assert_pattern_absent fixed "$fixture_slack_digest_marker" "$runner_log" "$daily_runner_log" "$image_scan" "$copied_bundle" "$copied_daily_bundle"
          assert_pattern_absent fixed "$private_key_marker" "$runner_log" "$daily_runner_log" "$image_scan" "$copied_bundle" "$copied_daily_bundle"

  application:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HEAVY: ${{ needs.changes.outputs.code == 'true' || github.ref == 'refs/heads/main' }}
      E2E_ARGS: ${{ github.ref == 'refs/heads/main' && '' || '-- --project=chromium' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level high
      - run: npm run lint
      - run: npm run typecheck
      - if: env.HEAVY == 'true'
        run: npm test
      - if: env.HEAVY == 'true'
        run: npx playwright install chromium
      - if: env.HEAVY == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.0
      - if: env.HEAVY == 'true'
        name: Start local Supabase without logging credentials
        run: supabase start > "$RUNNER_TEMP/compliancehub-supabase-start.log" 2>&1
      - if: env.HEAVY == 'true'
        name: Configure local application environment
        run: |
          eval "$(supabase status -o env)"
          app_encryption_key="$(openssl rand -base64 32)"
          echo "::add-mask::$API_URL"
          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          echo "::add-mask::ci-test-cron-secret"
          echo "::add-mask::$app_encryption_key"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3100"
            echo "CRON_SECRET=ci-test-cron-secret"
            echo "APP_ENCRYPTION_KEY=$app_encryption_key"
            echo "E2E_TEST_TOOLS_ENABLED=1"
            echo "SLACK_ALLOWED_WEBHOOK_SHA256=36b243d5b0e2304cbdf6f5bf362061b4f0e5cdc842c7f407af9253d0207cce52"
          } >> "$GITHUB_ENV"
      - if: env.HEAVY == 'true'
        run: npm run build
      - if: env.HEAVY == 'true'
        run: npm run test:integration
      - if: env.HEAVY == 'true'
        run: npm run test:e2e $E2E_ARGS
      - if: failure() && env.HEAVY == 'true'
        name: Upload bounded browser failure evidence
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/github-connection-*/test-failed-*.png
            test-results/github-connection-*/error-context.md
          if-no-files-found: warn
          retention-days: 7

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  database:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_NEEDED: ${{ needs.changes.outputs.db == 'true' || github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.0
      - if: env.DB_NEEDED == 'true'
        name: Start local Supabase without logging credentials
        run: supabase start > "$RUNNER_TEMP/compliancehub-supabase-start.log" 2>&1
      - if: env.DB_NEEDED == 'true'
        run: bash scripts/test-db-upgrade.sh
      - if: env.DB_NEEDED == 'true'
        run: supabase test db
