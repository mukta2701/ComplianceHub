name: Deploy AWS dev

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_github_reconciliation_acceptance:
        description: Run two bounded GitHub reconciliation checks against the deployed immutable image
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: compliancehub-aws-dev
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-2
  ECR_REPOSITORY: compliancehub-dev
  DEPLOY_SHA: ${{ github.sha }}

jobs:
  deploy:
    outputs:
      image_digest: ${{ steps.image_reference.outputs.image_digest }}
    runs-on: ubuntu-latest
    environment: aws-dev
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEV_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to ECR
        run: aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "${{ vars.AWS_DEV_ECR_REGISTRY }}"

      - name: Resolve image
        id: image
        run: |
          set -euo pipefail
          digest="$(aws ecr describe-images --region "$AWS_REGION" --repository-name "$ECR_REPOSITORY" --image-ids "imageTag=$DEPLOY_SHA" --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)"
          if [ -n "$digest" ] && [ "$digest" != None ]; then echo "digest=$digest" >> "$GITHUB_OUTPUT"; fi

      - name: Build and push immutable image
        id: build
        if: steps.image.outputs.digest == ''
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ vars.AWS_DEV_ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.DEPLOY_SHA }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_SITE_URL=${{ vars.AWS_DEV_SITE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set image reference
        id: image_reference
        run: |
          if [ -n "${{ steps.image.outputs.digest }}" ]; then
            image_digest="${{ steps.image.outputs.digest }}"
          else
            image_digest="${{ steps.build.outputs.digest }}"
          fi
          if [[ ! "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "resolved image digest is not immutable" >&2
            exit 1
          fi
          image_uri="${{ vars.AWS_DEV_ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}@$image_digest"
          echo "IMAGE_URI=$image_uri" >> "$GITHUB_ENV"
          echo "image_digest=$image_digest" >> "$GITHUB_OUTPUT"

      - name: Update App Runner service
        env:
          IMAGE: ${{ env.IMAGE_URI }}
          SERVICE_ARN: ${{ vars.AWS_DEV_SERVICE_ARN }}
          ACCESS_ROLE_ARN: ${{ vars.AWS_DEV_ACCESS_ROLE_ARN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.AWS_DEV_SITE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_ENCRYPTION_KEY: ${{ secrets.APP_ENCRYPTION_KEY }}
          SLACK_ALLOWED_WEBHOOK_SHA256: ${{ secrets.SLACK_ALLOWED_WEBHOOK_SHA256 }}
          GITHUB_APP_ID: ${{ secrets.AWS_DEV_GITHUB_APP_ID }}
          GITHUB_APP_CLIENT_ID: ${{ secrets.AWS_DEV_GITHUB_APP_CLIENT_ID }}
          GITHUB_APP_CLIENT_SECRET: ${{ secrets.AWS_DEV_GITHUB_APP_CLIENT_SECRET }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.AWS_DEV_GITHUB_APP_PRIVATE_KEY }}
          GITHUB_WEBHOOK_SECRET: ${{ secrets.AWS_DEV_GITHUB_WEBHOOK_SECRET }}
          GITHUB_APP_SLUG: ${{ secrets.AWS_DEV_GITHUB_APP_SLUG }}
          GITHUB_ALLOWED_ACCOUNT_ID: ${{ secrets.AWS_DEV_GITHUB_ALLOWED_ACCOUNT_ID }}
          GITHUB_APPROVED_SECURITY_WORKFLOW_IDS: ${{ secrets.AWS_DEV_GITHUB_APPROVED_SECURITY_WORKFLOW_IDS }}
        run: |
          set -euo pipefail
          umask 077
          request_file="$(mktemp)"
          trap 'rm -f "$request_file"' EXIT
          chmod 600 "$request_file"
          jq -n '
            {
              ServiceArn: env.SERVICE_ARN,
              SourceConfiguration: {
                ImageRepository: {
                  ImageIdentifier: env.IMAGE,
                  ImageRepositoryType: "ECR",
                  ImageConfiguration: {
                    Port: "3100",
                    RuntimeEnvironmentVariables: {
                      HOSTNAME: "::",
                      NEXT_PUBLIC_SUPABASE_URL: env.NEXT_PUBLIC_SUPABASE_URL,
                      NEXT_PUBLIC_SUPABASE_ANON_KEY: env.NEXT_PUBLIC_SUPABASE_ANON_KEY,
                      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,
                      NEXT_PUBLIC_SITE_URL: env.NEXT_PUBLIC_SITE_URL,
                      SUPABASE_SERVICE_ROLE_KEY: env.SUPABASE_SERVICE_ROLE_KEY,
                      CRON_SECRET: env.CRON_SECRET,
                      APP_ENCRYPTION_KEY: env.APP_ENCRYPTION_KEY,
                      SLACK_ALLOWED_WEBHOOK_SHA256: env.SLACK_ALLOWED_WEBHOOK_SHA256,
                      COMPLIANCEHUB_RELEASE_SHA: env.DEPLOY_SHA,
                      GITHUB_APP_ID: env.GITHUB_APP_ID,
                      GITHUB_APP_CLIENT_ID: env.GITHUB_APP_CLIENT_ID,
                      GITHUB_APP_CLIENT_SECRET: env.GITHUB_APP_CLIENT_SECRET,
                      GITHUB_APP_PRIVATE_KEY: env.GITHUB_APP_PRIVATE_KEY,
                      GITHUB_WEBHOOK_SECRET: env.GITHUB_WEBHOOK_SECRET,
                      GITHUB_APP_SLUG: env.GITHUB_APP_SLUG,
                      GITHUB_ALLOWED_ACCOUNT_ID: env.GITHUB_ALLOWED_ACCOUNT_ID,
                      GITHUB_ALLOWED_ACCOUNT_TYPE: "Organization",
                      GITHUB_APPROVED_SECURITY_WORKFLOW_IDS: env.GITHUB_APPROVED_SECURITY_WORKFLOW_IDS
                    }
                  }
                },
                AuthenticationConfiguration: {
                  AccessRoleArn: env.ACCESS_ROLE_ARN
                },
                AutoDeploymentsEnabled: false
              }
            }
          ' > "$request_file"
          aws apprunner update-service --region "$AWS_REGION" --cli-input-json "file://$request_file" --query 'Service.Status' --output text >/dev/null
          for _ in $(seq 1 80); do
            status="$(aws apprunner describe-service --region "$AWS_REGION" --service-arn "$SERVICE_ARN" --query Service.Status --output text)"
            test "$status" = RUNNING && break
            sleep 15
          done
          test "$status" = RUNNING

      - name: Verify deployed health
        env:
          SITE_URL: ${{ vars.AWS_DEV_SITE_URL }}
        run: |
          set -euo pipefail
          live="$(curl --fail-with-body --retry 5 --retry-all-errors --retry-delay 5 --retry-max-time 120 --connect-timeout 10 --max-time 120 "$SITE_URL/api/health/live")"
          jq --exit-status --arg release "$DEPLOY_SHA" '.status == "ok" and .releaseSha == $release' <<< "$live" >/dev/null
          curl --fail-with-body --retry 5 --retry-all-errors --retry-delay 5 --retry-max-time 120 --connect-timeout 10 --max-time 120 "$SITE_URL/api/health"

  reconcile_acceptance_first:
    if: github.event_name == 'workflow_dispatch' && inputs.run_github_reconciliation_acceptance == true
    needs: deploy
    runs-on: ubuntu-24.04
    environment: aws-dev
    timeout-minutes: 10
    concurrency:
      group: compliancehub-github-reconcile-aws-dev
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Run bounded connection reconciliation
        uses: ./.github/actions/reconcile-github-connections-aws-dev
        env:
          AWS_DEV_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEV_DEPLOY_ROLE_ARN }}
          AWS_DEV_SERVICE_ARN: ${{ vars.AWS_DEV_SERVICE_ARN }}
          AWS_DEV_ECR_REGISTRY: ${{ vars.AWS_DEV_ECR_REGISTRY }}
          AWS_DEV_SITE_URL: ${{ vars.AWS_DEV_SITE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.AWS_DEV_SITE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_ENCRYPTION_KEY: ${{ secrets.APP_ENCRYPTION_KEY }}
          SLACK_ALLOWED_WEBHOOK_SHA256: ${{ secrets.SLACK_ALLOWED_WEBHOOK_SHA256 }}
          GITHUB_APP_ID: ${{ secrets.AWS_DEV_GITHUB_APP_ID }}
          GITHUB_APP_SLUG: ${{ secrets.AWS_DEV_GITHUB_APP_SLUG }}
          GITHUB_APP_CLIENT_ID: ${{ secrets.AWS_DEV_GITHUB_APP_CLIENT_ID }}
          GITHUB_APP_CLIENT_SECRET: ${{ secrets.AWS_DEV_GITHUB_APP_CLIENT_SECRET }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.AWS_DEV_GITHUB_APP_PRIVATE_KEY }}
          GITHUB_WEBHOOK_SECRET: ${{ secrets.AWS_DEV_GITHUB_WEBHOOK_SECRET }}
          GITHUB_ALLOWED_ACCOUNT_ID: ${{ secrets.AWS_DEV_GITHUB_ALLOWED_ACCOUNT_ID }}
          GITHUB_ALLOWED_ACCOUNT_TYPE: Organization
          GITHUB_CONNECTION_MAX_WEBHOOK_DELIVERIES: "20"
          GITHUB_CONNECTION_MAX_INSTALLATIONS: "10"
          GITHUB_CONNECTION_MAX_SLACK_DELIVERIES: "10"
          GITHUB_CONNECTION_TIME_BUDGET_MS: "240000"
        with:
          expected-release-sha: ${{ github.sha }}
          expected-image-digest: ${{ needs.deploy.outputs.image_digest }}
          require-image-binding: "true"

  reconcile_acceptance_second:
    if: github.event_name == 'workflow_dispatch' && inputs.run_github_reconciliation_acceptance == true
    needs:
      - deploy
      - reconcile_acceptance_first
    runs-on: ubuntu-24.04
    environment: aws-dev
    timeout-minutes: 10
    concurrency:
      group: compliancehub-github-reconcile-aws-dev
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Run bounded connection reconciliation
        uses: ./.github/actions/reconcile-github-connections-aws-dev
        env:
          AWS_DEV_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEV_DEPLOY_ROLE_ARN }}
          AWS_DEV_SERVICE_ARN: ${{ vars.AWS_DEV_SERVICE_ARN }}
          AWS_DEV_ECR_REGISTRY: ${{ vars.AWS_DEV_ECR_REGISTRY }}
          AWS_DEV_SITE_URL: ${{ vars.AWS_DEV_SITE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.AWS_DEV_SITE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_ENCRYPTION_KEY: ${{ secrets.APP_ENCRYPTION_KEY }}
          SLACK_ALLOWED_WEBHOOK_SHA256: ${{ secrets.SLACK_ALLOWED_WEBHOOK_SHA256 }}
          GITHUB_APP_ID: ${{ secrets.AWS_DEV_GITHUB_APP_ID }}
          GITHUB_APP_SLUG: ${{ secrets.AWS_DEV_GITHUB_APP_SLUG }}
          GITHUB_APP_CLIENT_ID: ${{ secrets.AWS_DEV_GITHUB_APP_CLIENT_ID }}
          GITHUB_APP_CLIENT_SECRET: ${{ secrets.AWS_DEV_GITHUB_APP_CLIENT_SECRET }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.AWS_DEV_GITHUB_APP_PRIVATE_KEY }}
          GITHUB_WEBHOOK_SECRET: ${{ secrets.AWS_DEV_GITHUB_WEBHOOK_SECRET }}
          GITHUB_ALLOWED_ACCOUNT_ID: ${{ secrets.AWS_DEV_GITHUB_ALLOWED_ACCOUNT_ID }}
          GITHUB_ALLOWED_ACCOUNT_TYPE: Organization
          GITHUB_CONNECTION_MAX_WEBHOOK_DELIVERIES: "20"
          GITHUB_CONNECTION_MAX_INSTALLATIONS: "10"
          GITHUB_CONNECTION_MAX_SLACK_DELIVERIES: "10"
          GITHUB_CONNECTION_TIME_BUDGET_MS: "240000"
        with:
          expected-release-sha: ${{ github.sha }}
          expected-image-digest: ${{ needs.deploy.outputs.image_digest }}
          require-image-binding: "true"
