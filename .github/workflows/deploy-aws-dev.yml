name: Deploy AWS dev

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compliancehub-aws-dev
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-2
  ECR_REPOSITORY: compliancehub-dev
  DEPLOY_SHA: ${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: aws-dev
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEV_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to ECR
        run: aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "${{ vars.AWS_DEV_ECR_REGISTRY }}"

      - name: Build and push immutable image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ vars.AWS_DEV_ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.DEPLOY_SHA }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_SITE_URL=${{ vars.AWS_DEV_SITE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update App Runner service
        env:
          IMAGE: ${{ vars.AWS_DEV_ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}@${{ steps.build.outputs.digest }}
          SERVICE_ARN: ${{ vars.AWS_DEV_SERVICE_ARN }}
          ACCESS_ROLE_ARN: ${{ vars.AWS_DEV_ACCESS_ROLE_ARN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.AWS_DEV_SITE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_ENCRYPTION_KEY: ${{ secrets.APP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          source_config="$(jq -n \
            --arg image "$IMAGE" \
            --arg accessRole "$ACCESS_ROLE_ARN" \
            --arg supabaseUrl "$NEXT_PUBLIC_SUPABASE_URL" \
            --arg anonKey "$NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            --arg publishableKey "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" \
            --arg siteUrl "$NEXT_PUBLIC_SITE_URL" \
            --arg serviceRole "$SUPABASE_SERVICE_ROLE_KEY" \
            --arg cron "$CRON_SECRET" \
            --arg encryption "$APP_ENCRYPTION_KEY" \
            --arg release "$DEPLOY_SHA" \
            '{ImageRepository: {ImageIdentifier: $image, ImageRepositoryType: "ECR", ImageConfiguration: {Port: "3100", RuntimeEnvironmentVariables: {HOSTNAME: "::", NEXT_PUBLIC_SUPABASE_URL: $supabaseUrl, NEXT_PUBLIC_SUPABASE_ANON_KEY: $anonKey, NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: $publishableKey, NEXT_PUBLIC_SITE_URL: $siteUrl, SUPABASE_SERVICE_ROLE_KEY: $serviceRole, CRON_SECRET: $cron, APP_ENCRYPTION_KEY: $encryption, COMPLIANCEHUB_RELEASE_SHA: $release}}}, AuthenticationConfiguration: {AccessRoleArn: $accessRole}, AutoDeploymentsEnabled: false}')" 
          aws apprunner update-service --region "$AWS_REGION" --service-arn "$SERVICE_ARN" --source-configuration "$source_config" --query Service.Status --output text
          for _ in $(seq 1 40); do
            status="$(aws apprunner describe-service --region "$AWS_REGION" --service-arn "$SERVICE_ARN" --query Service.Status --output text)"
            test "$status" = RUNNING && break
            sleep 15
          done
          test "$status" = RUNNING

      - name: Verify deployed health
        env:
          SITE_URL: ${{ vars.AWS_DEV_SITE_URL }}
        run: |
          set -euo pipefail
          live="$(curl --fail-with-body --retry 5 --retry-all-errors --retry-delay 5 --retry-max-time 120 --connect-timeout 10 --max-time 120 "$SITE_URL/api/health/live")"
          jq --exit-status --arg release "$DEPLOY_SHA" '.status == "ok" and .releaseSha == $release' <<< "$live" >/dev/null
          curl --fail-with-body --retry 5 --retry-all-errors --retry-delay 5 --retry-max-time 120 --connect-timeout 10 --max-time 120 "$SITE_URL/api/health"
