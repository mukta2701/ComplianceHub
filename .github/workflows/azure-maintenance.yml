name: Azure scheduled maintenance

on:
  schedule:
    - cron: "29 5 * * *"
    - cron: "7 6 * * *"
    - cron: "13 7 * * *"
    - cron: "29 7 * * *"
  workflow_dispatch:
    inputs:
      route:
        description: Maintenance route to invoke
        required: true
        type: choice
        options:
          - github-collect
          - daily
          - monitor
          - automation-purge

permissions:
  contents: read

concurrency:
  group: azure-maintenance-${{ github.event.schedule || inputs.route }}
  cancel-in-progress: false

jobs:
  invoke:
    runs-on: ubuntu-latest
    environment: azure-staging
    timeout-minutes: 10
    steps:
      - name: Select maintenance route
        id: route
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          REQUESTED_ROUTE: ${{ inputs.route }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            case "$REQUESTED_ROUTE" in
              github-collect|daily|monitor|automation-purge) route="$REQUESTED_ROUTE" ;;
              *) echo "Unknown maintenance route" >&2; exit 1 ;;
            esac
          else
            case "$EVENT_SCHEDULE" in
              "29 5 * * *") route="github-collect" ;;
              "7 6 * * *") route="daily" ;;
              "13 7 * * *") route="monitor" ;;
              "29 7 * * *") route="automation-purge" ;;
              *) echo "Unknown maintenance schedule" >&2; exit 1 ;;
            esac
          fi
          echo "route=$route" >> "$GITHUB_OUTPUT"

      - name: Invoke authenticated maintenance route
        env:
          SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ROUTE: ${{ steps.route.outputs.route }}
        run: |
          set -euo pipefail
          curl --request POST \
            --fail-with-body \
            --retry 2 \
            --retry-all-errors \
            --retry-delay 5 \
            --max-time 300 \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "${SITE_URL}/api/cron/${ROUTE}"
