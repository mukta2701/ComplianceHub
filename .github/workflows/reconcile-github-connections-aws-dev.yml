name: Reconcile GitHub connections (AWS dev)

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      expected_release_sha:
        description: Optional release SHA to verify through the live health endpoint before running
        required: false
        type: string
  workflow_call:
    inputs:
      expected_release_sha:
        description: Release SHA to verify through the live health endpoint before running
        required: true
        type: string
      expected_image_uri:
        description: Immutable App Runner image URI resolved by the deployment job
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: compliancehub-github-reconcile-aws-dev
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-2
  ECR_REPOSITORY: compliancehub-dev

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    environment: aws-dev
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEV_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve current App Runner image
        id: image
        env:
          AWS_DEV_SERVICE_ARN: ${{ vars.AWS_DEV_SERVICE_ARN }}
          AWS_DEV_ECR_REGISTRY: ${{ vars.AWS_DEV_ECR_REGISTRY }}
          AWS_DEV_SITE_URL: ${{ vars.AWS_DEV_SITE_URL }}
          EXPECTED_RELEASE_SHA: ${{ inputs.expected_release_sha }}
          EXPECTED_IMAGE_URI: ${{ inputs.expected_image_uri }}
        run: |
          set -euo pipefail
          image="$(aws apprunner describe-service \
            --region "$AWS_REGION" \
            --service-arn "$AWS_DEV_SERVICE_ARN" \
            --query 'Service.SourceConfiguration.ImageRepository.ImageIdentifier' \
            --output text)"
          expected_prefix="${AWS_DEV_ECR_REGISTRY}/compliancehub-dev@sha256:"
          if [[ "$image" == "${AWS_DEV_ECR_REGISTRY}/compliancehub-dev:"* ]]; then
            echo "tag-only image identifier rejected" >&2
            exit 1
          fi
          if [[ "$image" == *@sha256:* && "$image" != "$expected_prefix"* ]]; then
            echo "wrong registry or wrong repository image identifier rejected" >&2
            exit 1
          fi
          if [[ "$image" != "$expected_prefix"* ]]; then
            echo "tag-only, wrong registry or wrong repository image identifier rejected" >&2
            exit 1
          fi
          digest="${image#"$expected_prefix"}"
          if [[ ! "$digest" =~ ^[0-9a-f]{64}$ ]]; then
            echo "immutable image digest must be 64 lowercase hexadecimal characters" >&2
            exit 1
          fi
          if [[ -n "$EXPECTED_IMAGE_URI" && "$EXPECTED_IMAGE_URI" != "$image" ]]; then
            echo "expected_image_uri does not match the current immutable App Runner image" >&2
            exit 1
          fi
          printf 'image=%s\n' "$image" >> "$GITHUB_OUTPUT"

          if [[ -n "$EXPECTED_RELEASE_SHA" ]]; then
            if [[ ! "$EXPECTED_RELEASE_SHA" =~ ^[0-9a-f]{7,64}$ ]]; then
              echo "expected_release_sha must be a lowercase hexadecimal release SHA" >&2
              exit 1
            fi
            live="$(curl --fail-with-body --retry 3 --retry-all-errors --retry-delay 2 \
              --connect-timeout 10 --max-time 60 "$AWS_DEV_SITE_URL/api/health/live")"
            jq --exit-status --arg release "$EXPECTED_RELEASE_SHA" \
              '.status == "ok" and .releaseSha == $release' <<< "$live" >/dev/null
          fi

      - name: Log in to ECR and pull immutable image
        env:
          AWS_DEV_ECR_REGISTRY: ${{ vars.AWS_DEV_ECR_REGISTRY }}
          IMAGE_URI: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "$AWS_REGION" | \
            docker login --username AWS --password-stdin "$AWS_DEV_ECR_REGISTRY"
          docker pull "$IMAGE_URI"

      - name: Run bounded connection reconciliation
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SITE_URL: ${{ vars.AWS_DEV_SITE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_ENCRYPTION_KEY: ${{ secrets.APP_ENCRYPTION_KEY }}
          SLACK_ALLOWED_WEBHOOK_SHA256: ${{ secrets.SLACK_ALLOWED_WEBHOOK_SHA256 }}
          GITHUB_APP_ID: ${{ secrets.AWS_DEV_GITHUB_APP_ID }}
          GITHUB_APP_SLUG: ${{ secrets.AWS_DEV_GITHUB_APP_SLUG }}
          GITHUB_APP_CLIENT_ID: ${{ secrets.AWS_DEV_GITHUB_APP_CLIENT_ID }}
          GITHUB_APP_CLIENT_SECRET: ${{ secrets.AWS_DEV_GITHUB_APP_CLIENT_SECRET }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.AWS_DEV_GITHUB_APP_PRIVATE_KEY }}
          GITHUB_WEBHOOK_SECRET: ${{ secrets.AWS_DEV_GITHUB_WEBHOOK_SECRET }}
          GITHUB_ALLOWED_ACCOUNT_ID: ${{ secrets.AWS_DEV_GITHUB_ALLOWED_ACCOUNT_ID }}
          GITHUB_ALLOWED_ACCOUNT_TYPE: Organization
          GITHUB_CONNECTION_MAX_WEBHOOK_DELIVERIES: "20"
          GITHUB_CONNECTION_MAX_INSTALLATIONS: "10"
          GITHUB_CONNECTION_MAX_SLACK_DELIVERIES: "10"
          GITHUB_CONNECTION_TIME_BUDGET_MS: "240000"
          IMAGE_URI: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          for secret_name in \
            SUPABASE_SERVICE_ROLE_KEY \
            APP_ENCRYPTION_KEY \
            SLACK_ALLOWED_WEBHOOK_SHA256 \
            GITHUB_APP_ID \
            GITHUB_APP_SLUG \
            GITHUB_APP_CLIENT_ID \
            GITHUB_APP_CLIENT_SECRET \
            GITHUB_APP_PRIVATE_KEY \
            GITHUB_WEBHOOK_SECRET \
            GITHUB_ALLOWED_ACCOUNT_ID; do
            printf '::add-mask::%s\n' "${!secret_name}"
          done

          container_name="compliancehub-github-reconcile-${GITHUB_RUN_ID}"
          runner_log="${RUNNER_TEMP}/compliancehub-github-reconcile-${GITHUB_RUN_ID}.log"
          cleanup() {
            docker rm -f "$container_name" >/dev/null 2>&1 || true
            rm -f "$runner_log"
          }
          trap cleanup EXIT

          set +e
          timeout 7m docker run \
            --name "$container_name" \
            --env NODE_ENV \
            --env NEXT_PUBLIC_SITE_URL \
            --env NEXT_PUBLIC_SUPABASE_URL \
            --env SUPABASE_SERVICE_ROLE_KEY \
            --env APP_ENCRYPTION_KEY \
            --env SLACK_ALLOWED_WEBHOOK_SHA256 \
            --env GITHUB_APP_ID \
            --env GITHUB_APP_SLUG \
            --env GITHUB_APP_CLIENT_ID \
            --env GITHUB_APP_CLIENT_SECRET \
            --env GITHUB_APP_PRIVATE_KEY \
            --env GITHUB_WEBHOOK_SECRET \
            --env GITHUB_ALLOWED_ACCOUNT_ID \
            --env GITHUB_ALLOWED_ACCOUNT_TYPE \
            --env GITHUB_CONNECTION_MAX_WEBHOOK_DELIVERIES \
            --env GITHUB_CONNECTION_MAX_INSTALLATIONS \
            --env GITHUB_CONNECTION_MAX_SLACK_DELIVERIES \
            --env GITHUB_CONNECTION_TIME_BUDGET_MS \
            "$IMAGE_URI" \
            node dist/github-connection-reconcile.mjs >"$runner_log" 2>&1
          status=$?
          set -e
          cat "$runner_log"
          cleanup
          trap - EXIT
          exit "$status"
